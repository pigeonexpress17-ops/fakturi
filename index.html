<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фактури</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2446a8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фактури">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f4; --paper:#fff; --ink:#18221f; --muted:#5d6b66; --line:#dde3e0; --line-strong:#c4cdc9;
  --accent:#2446a8; --accent-soft:#e6ebf8; --on-accent:#fff;
  --paid:#1d7a4f; --paid-soft:#e2f2e9; --unpaid:#a86412; --unpaid-soft:#fbf0de; --late:#b3261e; --late-soft:#fbe5e3;
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111715; --paper:#18201d; --ink:#e7ece9; --muted:#95a39e; --line:#28332f; --line-strong:#3a4742;
  --accent:#8ea8ff; --accent-soft:#1f2842; --on-accent:#111715;
  --paid:#5fcf95; --paid-soft:#15291f; --unpaid:#f0b35e; --unpaid-soft:#2d2314; --late:#ff8a80; --late-soft:#351a18; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,30px);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.pill{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--late)}
.btn.danger-solid{background:var(--late);border-color:var(--late);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left}
.sum .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sum .lbl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sum .val{font-family:var(--f-num);font-size:clamp(17px,3vw,22px);font-weight:600;overflow-wrap:anywhere}
.sum .cnt{font-size:13px;color:var(--muted)}
button.sum .val{color:var(--accent)}
@media (max-width:860px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;margin:0;font-weight:600}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;font-weight:500}
.seg button[aria-pressed="true"].p{background:var(--paid-soft);color:var(--paid)}
.seg button[aria-pressed="true"].u{background:var(--unpaid-soft);color:var(--unpaid)}
.grid3{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-strong);border-radius:7px;padding:10px;background:var(--bg);min-width:0;width:100%}
.fld input.r{text-align:right;font-family:var(--f-num)}
.fld input.auto{color:var(--muted)}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:1;background:transparent;border-color:var(--line);color:var(--ink)}
.bigpick{position:relative;border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.bigpick strong{font-size:16px}
.bigpick small{color:var(--muted)}
.bigpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.progress{display:flex;flex-direction:column;gap:4px;font-size:14px}
.progress span{display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate;flex:none}
.ok{color:var(--paid)} .err{color:var(--late)}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
@media (max-width:520px){.grid3{grid-template-columns:1fr}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-family:var(--f-num);margin-left:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.chip{border:0;background:transparent;padding:6px 11px;border-radius:6px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar select,.toolbar input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1 1 180px}

.ledger{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:140px minmax(0,1.6fr) minmax(0,1fr) 96px 130px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{font-family:var(--f-num);font-size:14px}
.date.late{color:var(--late);font-weight:600}
.amt{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:500;font-size:12px;font-family:var(--f-body)}
.stamp{border:1.5px solid currentColor;border-radius:5px;padding:3px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;background:transparent}
.stamp.paid{color:var(--paid);background:var(--paid-soft)}
.stamp.unpaid{color:var(--unpaid);background:var(--unpaid-soft)}
.stamp.late{color:var(--late);background:var(--late-soft)}
.stamp.pend{color:var(--accent);background:var(--accent-soft)}
.cat{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;margin-right:6px}
.tp{color:var(--paid)} .tu{color:var(--unpaid)} .ta{color:var(--accent)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line-strong);background:var(--bg);font-size:14px}
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who amt" "st dt";row-gap:6px}
  .c-who{grid-area:who}.c-amt{grid-area:amt}.c-st{grid-area:st}.c-dt{grid-area:dt;justify-self:end}.c-x{display:none}
}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 120px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.track{height:12px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex}
.track .fp{background:var(--paid)} .track .fu{background:var(--unpaid)}
.bar .v{font-family:var(--f-num);font-weight:600;text-align:right}
@media (max-width:560px){.bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm v" "tr tr"}.bar .nm{grid-area:nm}.bar .track{grid-area:tr}.bar .v{grid-area:v}}
.owe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.owe:first-child{border-top:0}
.owe .v{font-family:var(--f-num);font-weight:600;font-size:18px;text-align:right}
.owe small{color:var(--muted);font-size:13px;display:block}

.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--paper);width:min(540px,100%);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.drawer h3{font-family:var(--f-display);font-size:17px;margin:0;font-weight:600;overflow-wrap:anywhere}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.vatrow{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.vatrow label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.vatrow input[type=checkbox]{width:18px;height:18px}
.vatrow select{border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;background:var(--paper)}
.preview{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:440px;background:var(--bg)}
.preview img,.preview canvas{display:block;width:100%;height:auto}
.preview canvas{border-bottom:1px solid var(--line)}
.preview .ld{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.status{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.status.pend{background:var(--accent-soft);color:var(--accent)} .status.ok{background:var(--paid-soft);color:var(--paid)} .status.rej{background:var(--late-soft);color:var(--late)}
.rejectbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--late);border-radius:8px;padding:12px}
.rejectbox textarea{border:1px solid var(--line-strong);border-radius:7px;padding:9px;background:var(--bg);width:100%}
.dfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.notice{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:16px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Регистър фактури</h1><p class="sub" id="subLine">Зареждам…</p></div>
    <div class="actions"><span class="pill" id="rolePill" hidden></span><button class="btn" id="refreshBtn" type="button" hidden>Обнови</button><button class="btn primary" id="exportBtn" type="button" hidden>Изтегли Excel</button></div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="summary" id="summary" hidden>
    <div class="sum"><span class="lbl"><i style="background:var(--unpaid)"></i>Неплатени</span><span class="val" id="sU">—</span><span class="cnt" id="cU"></span></div>
    <div class="sum"><span class="lbl"><i style="background:var(--late)"></i>Просрочени</span><span class="val" id="sL">—</span><span class="cnt" id="cL"></span></div>
    <div class="sum"><span class="lbl"><i style="background:var(--paid)"></i>Платени</span><span class="val" id="sP">—</span><span class="cnt" id="cP"></span></div>
    <button class="sum" type="button" id="oweCard"><span class="lbl"><i style="background:var(--accent)"></i>Дължиш на хора</span><span class="val" id="sO">—</span><span class="cnt" id="cO"></span></button>
  </section>

  <section class="card" id="upCard" hidden>
    <h2>Качи фактура</h2>
    <div class="seg" role="group" aria-label="Плащане"><button type="button" class="u" id="upU" aria-pressed="true">Неплатена</button><button type="button" class="p" id="upP" aria-pressed="false">Платих я аз</button></div>
    <div class="grid3">
      <div class="fld"><label for="upTotal">Сума с ДДС (по желание)</label><input id="upTotal" class="r" inputmode="decimal" placeholder="0,00"></div>
      <div class="fld"><label for="upSupplier">Доставчик (по желание)</label><input id="upSupplier" placeholder="напр. Шел, ЧЕЗ…"></div>
      <div class="fld full"><label for="upNote">Бележка (по желание)</label><input id="upNote" placeholder="напр. гориво за бус СВ 1234"></div>
    </div>
    <div class="bigpick"><strong>Снимай фактурата или избери файл</strong><small>Снимка от телефона (всякакъв размер) или PDF до 10 MB · може няколко наведнъж</small>
      <input type="file" id="fileIn" accept="image/*,application/pdf" multiple aria-label="Избери файл"></div>
    <div class="progress" id="progress"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button class="tab" data-v="queue" role="tab" aria-selected="true" type="button">За одобрение<span class="badge" id="qBadge" hidden></span></button>
    <button class="tab" data-v="list" role="tab" aria-selected="false" type="button">Регистър</button>
    <button class="tab" data-v="cats" role="tab" aria-selected="false" type="button">По разходи</button>
    <button class="tab" data-v="owe" role="tab" aria-selected="false" type="button">Дължими на хора</button>
  </nav>

  <div class="toolbar" id="toolbar" hidden>
    <div class="chips" role="group" aria-label="Статус">
      <button class="chip" data-f="all" aria-pressed="true" type="button">Всички</button>
      <button class="chip" data-f="unpaid" aria-pressed="false" type="button">Неплатени</button>
      <button class="chip" data-f="late" aria-pressed="false" type="button">Просрочени</button>
      <button class="chip" data-f="paid" aria-pressed="false" type="button">Платени</button>
    </div>
    <select id="monthSel" aria-label="Месец"></select>
    <select id="catSel" aria-label="Вид разход"></select>
    <input type="search" id="q" placeholder="Търси доставчик, номер, човек…" aria-label="Търсене">
  </div>

  <section class="ledger" id="view"></section>
</div>

<div class="scrim" id="scrim" hidden>
  <form class="drawer" id="form" autocomplete="off" onsubmit="return false">
    <div class="dh"><h3 id="dTitle">Фактура</h3><button class="x" type="button" id="closeBtn" aria-label="Затвори">×</button></div>
    <div id="dStatus"></div>
    <div id="dFile"></div>
    <div id="dFields">
      <div class="seg" id="paySeg" style="margin-bottom:12px"><button type="button" class="u" id="segU" aria-pressed="true">Неплатена</button><button type="button" class="p" id="segP" aria-pressed="false">Платена</button></div>
      <div class="grid2">
        <div class="fld full"><label for="f_supplier">Доставчик</label><input id="f_supplier"></div>
        <div class="fld full"><label for="f_category">Вид разход</label><select id="f_category"></select></div>
        <div class="fld"><label for="f_eik">ЕИК</label><input id="f_eik" inputmode="numeric"></div>
        <div class="fld"><label for="f_number">№ фактура</label><input id="f_number" inputmode="numeric"></div>
        <div class="fld"><label for="f_date">Дата</label><input id="f_date" type="date"></div>
        <div class="fld"><label for="f_due">Падеж</label><input id="f_due" type="date"></div>
        <div class="vatrow"><label><input type="checkbox" id="f_novat"> Не се начислява ДДС</label><span id="rateWrap" class="actions"><span class="hint">Ставка</span><select id="f_rate"><option value="20">20%</option><option value="9">9%</option></select></span></div>
        <div class="fld"><label for="f_net">Без ДДС</label><input id="f_net" class="r" inputmode="decimal"></div>
        <div class="fld"><label for="f_vat">ДДС</label><input id="f_vat" class="r" inputmode="decimal"></div>
        <div class="fld"><label for="f_total">Общо с ДДС</label><input id="f_total" class="r" inputmode="decimal"></div>
        <div class="fld"><label for="f_currency">Валута</label><select id="f_currency"><option value="EUR">EUR (€)</option><option value="BGN">BGN (лв.)</option></select></div>
        <div class="fld" id="paidDateFld" hidden><label for="f_paidDate">Платена на</label><input id="f_paidDate" type="date"></div>
        <div class="fld full"><label for="f_note">Бележка</label><textarea id="f_note" rows="2"></textarea></div>
      </div>
    </div>
    <div class="rejectbox" id="rejBox" hidden>
      <label for="f_reason" class="hint">Причина за отказ (вижда я човекът, който я е качил)</label>
      <textarea id="f_reason" rows="2"></textarea>
      <div class="actions"><button type="button" class="btn" id="rejBack">Назад</button><button type="button" class="btn danger-solid" id="rejGo">Отхвърли</button></div>
    </div>
    <div class="dfoot" id="dFoot"></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
window.onerror = function (m) { var n = document.getElementById("notice"); if (n) { n.hidden = false; n.textContent = "Грешка в страницата: " + m; } };
const EXEC_URL = "https://script.google.com/macros/s/AKfycbwVgOMxNVMdfinN-O25WIfQPaW3LAqH6hpPG3pytrSGQT_t0PXtNtdaLMCUO36r61je7g/exec";
let TOKEN = "";
try { TOKEN = (new URLSearchParams(location.search).get("k") || localStorage.getItem("fakturi_k") || "").trim(); if (TOKEN) localStorage.setItem("fakturi_k", TOKEN); } catch (e) { TOKEN = (new URLSearchParams(location.search).get("k") || "").trim(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(() => {
  const RATE = 1.95583;
  const $ = s => document.querySelector(s);
  const S = { me: null, cats: [], pending: [], register: [], mine: [], people: [], ai: false, view: "queue", filter: "all", month: "", cat: "", q: "", drawer: null, draftPaid: false, upPaid: false };

  // ---------- helpers ----------
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fmtDate = iso => iso ? String(iso).slice(0, 10).split("-").reverse().join(".") : "—";
  const nf = new Intl.NumberFormat("bg-BG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  async function prep(f) {
    const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
    if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
      if (f.size > 10e6) throw new Error("PDF-ът е над 10 MB.");
      return { b64: await toB64(f), type: "application/pdf" };
    }
    let bmp; try { bmp = await createImageBitmap(f, { imageOrientation: "from-image" }); } catch (e) { throw new Error("Снимката не може да се отвори. Опитай JPG."); }
    const k = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
    return { b64: await toB64(blob), type: "image/jpeg" };
  }

    const base = "https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    pdfReady = add(base + "pdf.worker.min.js").then(() => add(base + "pdf.min.js")).then(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; return pdfjsLib; });
    pdfReady.catch(() => pdfReady = null); return pdfReady;
  }

      if (f.type !== "application/pdf") { pv.innerHTML = `<img alt="Фактура" src="data:${f.type};base64,${f.b64}">`; return; }
      const bin = atob(f.b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const doc = await (await loadPdf()).getDocument({ data: u, isEvalSupported: false }).promise; pv.innerHTML = "";
      for (let p = 1; p <= Math.min(doc.numPages, 5); p++) { if (tok !== pvTok) return; const page = await doc.getPage(p), vp = page.getViewport({ scale: 1.5 }); const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height; await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise; pv.appendChild(cv); }
    } catch (e) { if (tok === pvTok) box.innerHTML = `<div class="preview"><div class="ld">Файлът не може да се покаже.</div></div>`; }
  }

  // ---------- drawer form ----------
  const F = k => $("#f_" + k);

  let vatSrc = "total";
  const setV = (k, v) => F(k).value = v == null ? "" : nf.format(v);
  const rate = () => F("novat").checked ? 0 : (+F("rate").value || 20) / 100;
  function recalc(src) {
    vatSrc = src || vatSrc; const r = rate();
    $("#rateWrap").hidden = F("novat").checked; F("vat").disabled = F("novat").checked || F("net").disabled;
    ["net", "vat", "total"].forEach(k => F(k).classList.toggle("auto", k !== vatSrc));
    if (vatSrc === "net") { const n = parseNum(F("net").value); if (n == null) { setV("vat", null); setV("total", null); return; } const v = r2(n * r); setV("vat", v); setV("total", r2(n + v)); }
    else if (vatSrc === "total") { const t = parseNum(F("total").value); if (t == null) { setV("net", null); setV("vat", null); return; } const n = r2(t / (1 + r)); setV("net", n); setV("vat", r2(t - n)); }
    else { const n = parseNum(F("net").value), v = parseNum(F("vat").value); if (n != null && v != null) setV("total", r2(n + v)); }
  }
  F("net").oninput = () => recalc("net"); F("total").oninput = () => recalc("total"); F("vat").oninput = () => recalc("vat");
  F("novat").onchange = F("rate").onchange = () => recalc(vatSrc === "vat" ? "net" : vatSrc);
  ["net", "vat", "total"].forEach(k => F(k).addEventListener("blur", () => { const v = parseNum(F(k).value); if (v != null) setV(k, v); }));
  function setPaid(p) { S.draftPaid = p; $("#segP").setAttribute("aria-pressed", p); $("#segU").setAttribute("aria-pressed", !p); $("#paidDateFld").hidden = !p; if (p && !F("paidDate").value) F("paidDate").value = todayISO(); }
  $("#segP").onclick = () => { if (!$("#segP").disabled) setPaid(true); }; $("#segU").onclick = () => { if (!$("#segU").disabled) setPaid(false); };

  function fill(o, editable) {
    TXT.forEach(k => F(k).value = o[k] || "");
    F("category").innerHTML = S.cats.map(c => `<option>${esc(c)}</option>`).join(""); F("category").value = S.cats.includes(o.category) ? o.category : "Други";
    F("currency").value = o.currency === "BGN" ? "BGN" : "EUR";
    ["net", "vat", "total"].forEach(k => setV(k, o[k]));
    F("novat").checked = o.vatRate === 0; F("rate").value = o.vatRate === 9 ? "9" : "20";
    setPaid(isPaid(o));
    [...TXT, "category", "currency", "net", "vat", "total", "novat", "rate"].forEach(k => F(k).disabled = !editable);
    $("#segP").disabled = $("#segU").disabled = !editable;
    vatSrc = "total"; ["net", "vat", "total"].forEach(k => F(k).classList.remove("auto"));
    $("#rateWrap").hidden = F("novat").checked; F("vat").disabled = !editable || F("novat").checked;
  }
  function readForm() {
    const o = {}; TXT.forEach(k => o[k] = F(k).value);
    Object.assign(o, { category: F("category").value, currency: F("currency").value, net: parseNum(F("net").value), vat: parseNum(F("vat").value), total: parseNum(F("total").value),
      vatRate: F("novat").checked ? 0 : +F("rate").value, payment: S.draftPaid ? "Платена" : "Неплатена" });
    if (!S.draftPaid) o.paidDate = "";
    return o;
  }
  const foot = h => $("#dFoot").innerHTML = h;
  const close = () => { $("#scrim").hidden = true; S.drawer = null; pvTok++; };
  $("#closeBtn").onclick = close;
  $("#scrim").onclick = e => { if (e.target.id === "scrim") close(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#scrim").hidden) close(); });
  $("#dFoot").addEventListener("click", e => { if (e.target.closest("[data-close]")) close(); });

  function armBtn(btn, label, fn) {
    let a = false;
    btn.onclick = async () => { if (!a) { a = true; btn.textContent = label; btn.classList.add("danger-solid"); return; }
      btn.disabled = true; try { await fn(); } catch (err) { toast(errMsg(err)); btn.disabled = false; } };
  }
  async function run(btn, busy, fn) { const t = btn.textContent; btn.disabled = true; btn.textContent = busy; try { await fn(); } catch (err) { toast(errMsg(err)); btn.disabled = false; btn.textContent = t; } }

  function openDoc(o, kind) {
    if (!o) return;
    S.drawer = { o, kind };
    $("#dTitle").textContent = o.supplier || "Фактура";
    $("#rejBox").hidden = true; $("#dFields").hidden = false; $("#dFoot").hidden = false;
    const cls = o.status === "Одобрена" ? "ok" : o.status === "Отхвърлена" ? "rej" : "pend";
    let st = `<b>${esc(o.status || "Чака одобрение")}</b><span>Качена от ${esc(o.uploadedBy || S.me.name)} на ${fmtDate(o.uploadedAt)}</span>`;
    if (o.status === "Отхвърлена" && o.reason) st += `<span>Причина: ${esc(o.reason)}</span>`;
    if (o.paidBy && kind !== "mine") st += `<span><b>${esc(o.paidBy)} я е платил сам</b>${o.reimbursed === "Да" ? " — парите са му върнати." : " — сумата се води като дълг към него."}</span>`;
    $("#dStatus").innerHTML = `<div class="status ${cls}">${st}</div>`;
    preview(o.id);

    if (kind === "pending") {
      fill(o, isAdmin());
      if (isAdmin()) {
        foot(`<div class="actions"><button type="button" class="btn danger" id="rejBtn">Отхвърли</button>${S.ai ? '<button type="button" class="btn" id="aiBtn">Разчети</button>' : ""}</div><button type="button" class="btn primary" id="okBtn">Одобри</button>`);
        $("#okBtn").onclick = () => run($("#okBtn"), "Одобрявам…", async () => { await api("apiApprove", o.id, readForm()); close(); toast("Одобрена — вече е в регистъра"); await load(true); });
        $("#rejBtn").onclick = () => { $("#rejBox").hidden = false; $("#dFields").hidden = true; $("#dFoot").hidden = true; F("reason").value = ""; F("reason").focus(); };
        if ($("#aiBtn")) $("#aiBtn").onclick = () => run($("#aiBtn"), "Разчитам…", async () => { const r = await api("apiExtract", o.id); if (r && r.fields) { fill({ ...r.fields, payment: S.draftPaid ? "Платена" : "Неплатена" }, true); toast("Полетата са попълнени — провери ги."); } else toast("Не успях да разчета фактурата."); $("#aiBtn").disabled = false; $("#aiBtn").textContent = "Разчети"; });
      } else foot(`<span></span><button type="button" class="btn" data-close>Затвори</button>`);
    } else if (kind === "register") {
      fill(o, isAdmin());
      if (isAdmin()) {
        foot(`<button type="button" class="btn danger" id="delBtn">Изтрий</button><div class="actions"><button type="button" class="btn" data-close>Отказ</button><button type="button" class="btn primary" id="saveBtn">Запази</button></div>`);
        $("#saveBtn").onclick = () => run($("#saveBtn"), "Записвам…", async () => { const f = readForm(); if (f.total == null) throw new Error("Въведи сумата."); await api("apiUpdate", o.id, f); close(); toast("Запазено"); await load(true); });
        armBtn($("#delBtn"), "Потвърди изтриването", async () => { await api("apiDelete", o.id); close(); toast("Изтрита"); await load(true); });
      } else foot(`<span></span><button type="button" class="btn" data-close>Затвори</button>`);
    } else {
      fill(o, false);
      const canEdit = o.status === "Чака одобрение";
      $("#segP").disabled = $("#segU").disabled = !canEdit;
      $("#segP").textContent = "Платих я аз";
      if (canEdit) {
        foot(`<button type="button" class="btn danger" id="wdBtn">Оттегли</button><div class="actions"><button type="button" class="btn" data-close>Затвори</button><button type="button" class="btn primary" id="saveBtn">Запази</button></div>`);
        $("#saveBtn").onclick = () => run($("#saveBtn"), "Записвам…", async () => { await api("apiMine", o.id, "pay", S.draftPaid); close(); toast("Запазено"); await load(true); });
        armBtn($("#wdBtn"), "Потвърди оттеглянето", async () => { await api("apiMine", o.id, "delete"); close(); toast("Оттеглена"); await load(true); });
      } else if (o.status === "Отхвърлена") {
        foot(`<button type="button" class="btn danger" id="wdBtn">Премахни от списъка</button><button type="button" class="btn" data-close>Затвори</button>`);
        armBtn($("#wdBtn"), "Потвърди", async () => { await api("apiMine", o.id, "delete"); close(); await load(true); });
      } else foot(`<span></span><button type="button" class="btn" data-close>Затвори</button>`);
    }
    if (kind !== "mine") $("#segP").textContent = "Платена";
    $("#scrim").hidden = false;
  }
  $("#rejBack").onclick = () => { $("#rejBox").hidden = true; $("#dFields").hidden = false; $("#dFoot").hidden = false; };
  $("#rejGo").onclick = () => { const reason = F("reason").value.trim(); if (!reason) { F("reason").focus(); return toast("Напиши причината."); }
    run($("#rejGo"), "Отхвърлям…", async () => { await api("apiReject", S.drawer.o.id, reason); close(); toast("Отхвърлена"); await load(true); $("#rejGo").disabled = false; $("#rejGo").textContent = "Отхвърли"; }); };

  // ---------- Excel ----------
  $("#exportBtn").onclick = () => {
    const rows = filtered().slice().sort((a, b) => String(a.date || a.uploadedAt).localeCompare(String(b.date || b.uploadedAt)));
    if (!rows.length) return toast("Няма одобрени фактури в този изглед.");
    if (!window.XLSX) return toast("Excel модулът не се зареди. Обнови страницата.");
    const d = s => s ? new Date(String(s).slice(0, 10) + "T00:00:00") : null;
    const head = ["Статус", "Вид разход", "Доставчик", "ЕИК", "№ фактура", "Дата", "Падеж", "Без ДДС", "ДДС", "Общо", "Валута", "Общо (EUR)", "Дата на плащане", "Качена от", "Платена лично от", "Парите върнати", "Бележка"];
    const aoa = [head, ...rows.map(o => [isPaid(o) ? "Платена" : isLate(o) ? "Просрочена" : "Неплатена", o.category || "Други", o.supplier || "", o.eik || "", o.number || "", d(o.date), d(o.due),
      o.net, o.vat, o.total, o.currency || "EUR", eur(o), d(o.paidDate), o.uploadedBy || "", o.paidBy || "", o.paidBy ? (o.reimbursed === "Да" ? "Да" : "Не") : "", o.note || ""])];
    const last = rows.length + 1;
    aoa.push([]);
    aoa.push(["", "", "Неплатени (EUR)", "", "", "", "", "", "", "", "", { f: `SUMIF(A2:A${last},"<>Платена",L2:L${last})` }]);
    aoa.push(["", "", "Платени (EUR)", "", "", "", "", "", "", "", "", { f: `SUMIF(A2:A${last},"Платена",L2:L${last})` }]);
    aoa.push(["", "", "Общо (EUR)", "", "", "", "", "", "", "", "", { f: `SUM(L2:L${last})` }]);
    const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true }), rg = XLSX.utils.decode_range(ws["!ref"]);
    for (let R = 1; R <= rg.e.r; R++) { [5, 6, 12].forEach(C => { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c && c.t === "d") c.z = "dd.mm.yyyy"; }); [7, 8, 9, 11].forEach(C => { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c) c.z = "#,##0.00"; }); }
    ws["!cols"] = [12, 26, 30, 14, 14, 12, 12, 12, 12, 12, 8, 13, 15, 18, 18, 12, 30].map(w => ({ wch: w }));
    ws["!autofilter"] = { ref: `A1:Q${last}` };
    const cats = [...new Set(rows.map(o => o.category || "Други"))], lr = cats.length + 1;
    const SI = (r, c) => `SUMIFS('Фактури'!$L$2:$L$${last},'Фактури'!$B$2:$B$${last},A${r},'Фактури'!$A$2:$A$${last},${c})`;
    const aoa2 = [["Вид разход", "Брой", "Платено (EUR)", "Неплатено (EUR)", "Общо (EUR)"]];
    cats.forEach((c, i) => { const r = i + 2; aoa2.push([c, { f: `COUNTIF('Фактури'!$B$2:$B$${last},A${r})` }, { f: SI(r, '"Платена"') }, { f: SI(r, '"<>Платена"') }, { f: `C${r}+D${r}` }]); });
    aoa2.push(["Общо", { f: `SUM(B2:B${lr})` }, { f: `SUM(C2:C${lr})` }, { f: `SUM(D2:D${lr})` }, { f: `SUM(E2:E${lr})` }]);
    const ws2 = XLSX.utils.aoa_to_sheet(aoa2); for (let R = 1; R <= lr; R++) [2, 3, 4].forEach(C => { const c = ws2[XLSX.utils.encode_cell({ r: R, c: C })]; if (c) c.z = "#,##0.00"; });
    ws2["!cols"] = [30, 8, 15, 16, 14].map(w => ({ wch: w }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Фактури"); XLSX.utils.book_append_sheet(wb, ws2, "По разходи");
    try { XLSX.writeFile(wb, `Фактури ${todayISO()}.xlsx`); toast("Excel файлът се изтегля"); }
    catch (e) { toast("Браузърът спря изтеглянето. Изтегли от Google Таблицата: Файл → Изтегляне → Excel."); }
  };

  // ---------- start ----------
  if (!TOKEN) { notice("Липсва личният ти линк. Отвори приложението от линка, който ти е изпратил администраторът."); $("#subLine").textContent = ""; }
  else load(false);
  setTimeout(() => { if (!S.me && $("#notice").hidden) notice("Зареждането е бавно. Провери интернета и отвори приложението отново."); }, 25000);
})();
</script>
</body>
</html>
